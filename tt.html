    <script>
    // *** 請在這裡設定貴校的 Google Workspace 網域名稱 ***
    const SCHOOL_DOMAIN = "bhnkc.edu.hk"; 

    // 解碼 JWT
    function decodeJwtResponse(token) {
        try {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        } catch (e) {
            return null;
        }
    }

    // ==========================================
    // Google 登入驗證機制
    // ==========================================
    const id_token = window.sessionStorage.getItem('google_id_token');
    let is_authenticated = true;

    if (id_token) {
        const payload = decodeJwtResponse(id_token);
        if (payload && payload.hd === SCHOOL_DOMAIN && payload.exp && (payload.exp * 1000) > Date.now()) {
            is_authenticated = true;
        }
    }

    if (!is_authenticated) {
        window.top.location.href = 'index.html';
    }
    // ==========================================
    </script>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const teacherNameInput = document.getElementById('teacherName');
        const teacherDropdown = document.getElementById('teacherDropdown');
        const classDropdown = document.getElementById('classDropdown');
        const loadingDiv = document.getElementById('loading');
        const resultDiv = document.getElementById('result');
        const timetableTable = document.getElementById('timetable');
        const exportBtnGroup = document.getElementById('exportBtnGroup');
        
        let allLessons = []; 
        let allTeachers = []; 
        let allClasses = []; 
        let currentTitle = ''; 
        let currentLessons = []; 
        let currentFontSize = 100; 
        
        const timeSlots = [
            { time: '8:05', period: '0', endTime: '8:20', isBreak: true, label: 'ASSEMBLY' },
            { time: '8:20', period: '1', endTime: '8:55', isBreak: false },
            { time: '8:55', period: '2', endTime: '9:30', isBreak: false },
            { time: '9:30', period: '', endTime: '9:45', isBreak: true, label: 'RECESS' },
            { time: '9:45', period: '3', endTime: '10:20', isBreak: false },
            { time: '10:20', period: '4', endTime: '10:55', isBreak: false },
            { time: '10:55', period: '', endTime: '11:10', isBreak: true, label: 'RECESS' },
            { time: '11:10', period: '5', endTime: '11:45', isBreak: false },
            { time: '11:45', period: '6', endTime: '12:20', isBreak: false },
            { time: '12:20', period: '7', endTime: '12:55', isBreak: false },
            { time: '12:55', period: '', endTime: '14:00', isBreak: true, label: 'LUNCH' },
            { time: '14:00', period: '', endTime: '14:05', isBreak: true, label: 'ASSEMBLY' },
            { time: '14:05', period: '8', endTime: '14:40', isBreak: false },
            { time: '14:40', period: '9', endTime: '15:15', isBreak: false },
            { time: '15:15', period: '10', endTime: '15:50', isBreak: false }
        ];

        // 判斷單/雙周輔助函式
        function isOddLesson(l) {
            if (!l.week) return true;
            const w = l.week.toString().trim().toLowerCase();
            return w.includes('odd') || w.includes('單') || w === '1';
        }

        function isEvenLesson(l) {
            if (!l.week) return true;
            const w = l.week.toString().trim().toLowerCase();
            return w.includes('even') || w.includes('雙') || w === '2';
        }

        // 格式化科目與課室輔助函式 (例如：BIO (R311))
        function formatSubjWithRoom(lessons) {
            return [...new Set(lessons.map(l => l.subject + (l.room ? ` (${l.room})` : '')))].filter(Boolean).join(' / ');
        }

        // 格式化補課科目與教師、課室輔助函式 (例如：CHIN (CHM R413 / NKK R401 / PKK R201))
        function formatSubjWithTeacherRoom(lessons, isHtml = true) {
            if (!lessons || lessons.length === 0) return '';
            
            const subjectMap = new Map();
            lessons.forEach(l => {
                const subj = l.subject ? l.subject.trim() : '';
                if (!subj) return;
                if (!subjectMap.has(subj)) {
                    subjectMap.set(subj, []);
                }
                const teacherRoom = [l.teacher ? l.teacher.trim() : '', l.room ? l.room.trim() : ''].filter(Boolean).join(' ');
                if (teacherRoom) {
                    subjectMap.get(subj).push(teacherRoom);
                }
            });

            const resultParts = [];
            subjectMap.forEach((infoList, subj) => {
                const uniqueInfo = [...new Set(infoList)];
                if (uniqueInfo.length > 0) {
                    const infoStr = uniqueInfo.join(' / ');
                    if (isHtml) {
                        resultParts.push(`${subj} <span style="font-size: 9px; font-weight: normal; color: #555;">(${infoStr})</span>`);
                    } else {
                        resultParts.push(`${subj} (${infoStr})`);
                    }
                } else {
                    resultParts.push(subj);
                }
            });

            return resultParts.join(' / ');
        }

        // 計算並取得該課堂的有效班別名稱
        function getEffectiveClass(lesson) {
            if (!lesson || !lesson.class) return '';
            if (lesson.group && lesson.group.trim() !== '') {
                const grp = lesson.group.trim().toUpperCase();
                if (/^[1-6]/.test(grp)) {
                    return grp;
                }
                const gradeMatch = lesson.class.match(/^[1-6]/);
                const grade = gradeMatch ? gradeMatch[0] : (lesson.year || '');
                return (grade + grp).toUpperCase();
            }
            return lesson.class.trim().toUpperCase();
        }

        // 判斷課堂是否屬於被查詢的班別
        function isLessonForClass(lesson, targetClass) {
            if (!targetClass) return false;
            const target = targetClass.trim().toUpperCase();
            const effClass = getEffectiveClass(lesson);
            
            if (effClass === target || lesson.class.trim().toUpperCase() === target) {
                return true;
            }
            
            const targetGradeMatch = target.match(/^[1-6]/);
            if (targetGradeMatch) {
                const grade = targetGradeMatch[0];
                const letter = target.replace(/^[1-6]/, '');
                if (letter && lesson.group) {
                    const grpUpper = lesson.group.trim().toUpperCase();
                    const lessonGradeMatch = lesson.class.match(/^[1-6]/);
                    const lessonGrade = lessonGradeMatch ? lessonGradeMatch[0] : (lesson.year || '');
                    if (grade === lessonGrade && grpUpper.includes(letter)) {
                        return true;
                    }
                }
            }
            return false;
        }

        window.handleGoogleSheetResponse = function(jsonData) {
            try {
                if (!jsonData || !jsonData.table || !jsonData.table.rows) {
                    throw new Error("試算表格式不正確或未公開發佈！");
                }
                
                const rows = jsonData.table.rows;
                allLessons = [];
                
                rows.forEach(row => {
                    const c = row.c;
                    if (c && c.length >= 7) {
                        allLessons.push({
                            year:           c[0] ? String(c[0].v).trim() : '',
                            day:            c[1] ? parseInt(c[1].v) : 0,
                            period:         c[2] ? parseInt(c[2].v) : 0,
                            teacher:        c[3] ? String(c[3].v).trim() : '',
                            class:          c[4] ? String(c[4].v).trim() : '',
                            subject:        c[5] ? String(c[5].v).trim() : '',
                            room:           c[6] ? String(c[6].v).trim() : '', 
                            teacherChinese: c[7] ? String(c[7].v).trim() : (c[6] ? String(c[6].v).trim() : ''),
                            group:          c[8] && c[8].v !== null && c[8].v !== undefined ? String(c[8].v).trim() : '',
                            week:           c[9] && c[9].v !== null && c[9].v !== undefined ? String(c[9].v).trim() : ''
                        });
                    }
                });

                allTeachers = [...new Set(allLessons.map(item => item.teacher))].filter(Boolean).sort();
                
                allClasses = [...new Set(
                    allLessons
                        .map(item => item.class.trim().toUpperCase())
                        .filter(cls => /^[1-6][A-Z]$/i.test(cls))
                )].sort();
                
                populateDropdowns();
                loadingDiv.style.display = 'none';
                resultDiv.innerHTML = '<p style="color:green;">時間表數據已同步（最新狀態）</p>';  
                initExportButtons();
                
            } catch (error) {
                console.error('解析雲端資料時出錯:', error);
                loadingDiv.innerHTML = `<p style="color:red">數據解析失敗: ${error.message}<br>請通知系統管理員。</p>`; 
            }
        };

        function loadGoogleSheetData() {
            const sheetId = '10TdramDTMZLQxl-jShrZeYJLCTtq0iu98PVPb-sZXyU';
            const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:handleGoogleSheetResponse&t=`;
            
            const script = document.createElement('script');
            script.src = url + Date.now(); 
            script.onerror = function() {
                loadingDiv.innerHTML = `<p style="color:red">未能連上數據庫。<br>請通知系統管理員。<br>請使用 CHROME 或 EDGE 瀏覽器。</p>`; 
                setTimeout(loadGoogleSheetData, 2000);
            };
            document.head.appendChild(script);
        }

        function initExportButtons() {
            exportBtnGroup.innerHTML = `
                <button id="printBtn" class="export-btn">列印時間表</button>
                <button id="pdfBtn" class="export-btn">匯出PDF</button>
                <button id="excelBtn" class="export-btn">匯出Excel</button>
                <button id="decreaseFontBtn" class="export-btn">-</button>
                <button id="increaseFontBtn" class="export-btn">+</button>
            `;
            
            document.getElementById('printBtn').addEventListener('click', printTimetable);
            document.getElementById('pdfBtn').addEventListener('click', exportToPDF);
            document.getElementById('excelBtn').addEventListener('click', exportToExcel);
            document.getElementById('increaseFontBtn').addEventListener('click', increaseFontSize);
            document.getElementById('decreaseFontBtn').addEventListener('click', decreaseFontSize);
            
            const savedFontSize = getCookie('timetableFontSize');
            if (savedFontSize) {
                currentFontSize = parseInt(savedFontSize);
                applyFontSize();
            }
        }
        
        function increaseFontSize() {
            if (currentFontSize < 150) {
                currentFontSize += 10;
                applyFontSize();
                setCookie('timetableFontSize', currentFontSize, 30);
            }
        }
        
        function decreaseFontSize() {
            if (currentFontSize > 70) {
                currentFontSize -= 10;
                applyFontSize();
                setCookie('timetableFontSize', currentFontSize, 30);
            }
        }
        
        function applyFontSize() {
            const table = document.getElementById('timetable');
            if (!table) return;
            const baseSize = currentFontSize / 100;
            table.querySelectorAll('td, th').forEach(el => {
                el.style.fontSize = `${baseSize * 11}px`;
            });
            table.querySelectorAll('.subject').forEach(el => {
                el.style.fontSize = `${baseSize * 14}px`;
            });
            table.querySelectorAll('.room, .teacher, .dismissal-time').forEach(el => {
                el.style.fontSize = `${baseSize * 10}px`;
            });
        }
        
        function setCookie(name, value, days) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + date.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }
        
        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) == ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        // =====================================================================
        // 匯出 EXCEL 功能
        // =====================================================================
        function exportToExcel() {
            if (!currentTitle || currentLessons.length === 0) {
                alert('請先查詢時間表');
                return;
            }

            if (typeof XLSX === 'undefined') {
                alert('Excel 匯出元件載入中，請稍候片刻再試。');
                return;
            }

            const wb = XLSX.utils.book_new();

            const borderBlack = {
                top: { style: "medium", color: { rgb: "000000" } },
                bottom: { style: "medium", color: { rgb: "000000" } },
                left: { style: "medium", color: { rgb: "000000" } },
                right: { style: "medium", color: { rgb: "000000" } }
            };

            const titleStyle = {
                font: { name: "Segoe UI", sz: 14, bold: true },
                alignment: { horizontal: "left", vertical: "center" }
            };

            const headerStyle = {
                font: { name: "Segoe UI", sz: 11, bold: true },
                alignment: { horizontal: "center", vertical: "center" },
                border: borderBlack,
                fill: { fgColor: { rgb: "FFFFFF" } }
            };

            const timeColStyle = {
                font: { name: "Segoe UI", sz: 10, bold: true },
                alignment: { horizontal: "center", vertical: "center", wrapText: true },
                border: borderBlack
            };

            const specialRowStyle = {
                font: { name: "Segoe UI", sz: 11, bold: true },
                alignment: { horizontal: "center", vertical: "center" },
                border: borderBlack
            };

            const cellStyle = {
                font: { name: "Segoe UI", sz: 10 },
                alignment: { horizontal: "center", vertical: "center", wrapText: true },
                border: borderBlack
            };

            const ws = {};
            const merges = [];
            const rowHeights = [];

            const isClassQuery = currentTitle.includes('班別');

            let titleName = currentTitle;
            if (isClassQuery) {
                titleName = currentTitle.replace(' 的時間表', '');
            } else {
                if (currentTitle.includes(' 的時間表')) {
                    titleName = currentTitle.split(' 的時間表')[0];
                }
            }

            ws["A1"] = { v: `時間表: ${titleName}`, s: titleStyle };
            merges.push({ s: { r: 0, c: 0 }, e: { r: 0, c: 5 } });
            rowHeights.push({ hpt: 28 });

            const headers = ["", "星期一", "星期二", "星期三", "星期四", "星期五"];
            headers.forEach((h, colIdx) => {
                const cellRef = XLSX.utils.encode_cell({ r: 1, c: colIdx });
                ws[cellRef] = { v: h, s: headerStyle };
            });
            rowHeights.push({ hpt: 24 });

            function toChinese12Hr(timeStr) {
                if (!timeStr) return '';
                const parts = timeStr.split(':');
                let h = parseInt(parts[0], 10);
                const m = parts[1] ? parts[1].padStart(2, '0') : '00';
                let period = '上午';
                if (h >= 12) {
                    period = '下午';
                    if (h > 12) h -= 12;
                }
                return `${period} ${h}:${m}`;
            }

            function getChineseBreakLabel(slot) {
                if (slot.time === '8:05') return '課前集會';
                if (slot.time === '9:30') return '小息';
                if (slot.time === '10:55') return '小息';
                if (slot.time === '12:55') return '午膳';
                if (slot.time === '14:00') return '午間宣佈';
                return slot.label || '';
            }

            function formatLessonCellForExcel(dayLessons, day, slotPeriod) {
                if (!dayLessons || dayLessons.length === 0) {
                    if (day === 3 && slotPeriod === '10') {
                        return '(CPA 14:40 - 15:30)';
                    }
                    return '';
                }

                const lines = [];

                if (day === 3 && slotPeriod === '10') {
                    lines.push('(CPA 14:40 - 15:30)');
                }

                if (isClassQuery) {
                    const teachers = [...new Set(dayLessons.map(l => l.teacher))].join(',');
                    const rooms = [...new Set(dayLessons.filter(l => l.room).map(l => l.room))].join(',');
                    const hasMaup = dayLessons.some(l => l.subject === 'MAUP');
                    const hasChem = dayLessons.some(l => l.subject.includes('CHEM'));
                    const hasIct = dayLessons.some(l => l.subject.includes('ICT'));
                    const hasPHY = dayLessons.some(l => l.subject.includes('PHY'));

                    const hasGroup = dayLessons.some(l => l.group && l.group.trim() !== '');
                    const groupClassNames = [...new Set(dayLessons.map(l => getEffectiveClass(l)).filter(c => c))];

                    if (hasChem && hasIct) {
                        lines.push('X2/X3');
                        if (rooms) lines.push(rooms);
                        if (teachers) lines.push(`(${teachers})`);
/*                    } else if (hasChem && slotPeriod !== '10') {
                        lines.push('X2');
                        if (rooms) lines.push(rooms);
                        if (teachers) lines.push(`(${teachers})`);*/

        function simplifyClassNames(classNames) {
            if (classNames.length <= 1) return classNames[0];
            classNames.sort();
            const gradeMap = {};
            classNames.forEach(className => {
                const grade = className[0];
                const classLetter = className.substring(1);
                if (!gradeMap[grade]) gradeMap[grade] = [];
                gradeMap[grade].push(classLetter);
            });
            let result = [];
            for (const grade in gradeMap) {
                const letters = gradeMap[grade];
                if (letters.length > 1) {
                    result.push(`${grade}${letters[0]}/${letters.slice(1).join('/')}`);
                } else {
                    result.push(`${grade}${letters[0]}`);
                }
            }
            return result.join(' ');
        }

        function formatLessonForExport(lesson, isClassQuery, dayLessons = []) {
            if (isClassQuery) {
                let subject = lesson.subject;
                if (subject.includes('PHY')) subject = 'X1';
                if (subject.includes('CHEM')) subject = 'X2';
                if (subject.includes('ICT')) subject = 'X3';
                return `<span style="color:blue;font-size:12px">${subject}<br></span>${lesson.room ? `<span style="color:#555;font-size:8px">${lesson.room}<br></span>` : ''}<span style="font-size:8px">(${lesson.teacher})</span>`;
            }
            if (lesson.subject === 'MAUP') {
                return `<span style="color:blue;font-size:9px">${getEffectiveClass(lesson)} MAUP</span>`;
            }

            const teacherSlotLessons = currentLessons.filter(
                l => l.day === lesson.day && 
                     l.period === lesson.period && 
                     l.subject === lesson.subject
            );
            const teacherEffectiveClasses = [...new Set(teacherSlotLessons.map(l => getEffectiveClass(l)))].sort();
            const classDisplay = teacherEffectiveClasses.length > 1 
                ? simplifyClassNames(teacherEffectiveClasses) 
                : (teacherEffectiveClasses[0] || getEffectiveClass(lesson));

            const noCoTeacherSubjects = ['ARD', 'CPA', 'READ', 'MAUP'];
            let coTeachers = '';
            if (!noCoTeacherSubjects.includes(lesson.subject)) {
                const sameLessons = allLessons.filter(
                    l => l.day === lesson.day && 
                         l.period === lesson.period && 
                         l.subject === lesson.subject && 
                         teacherEffectiveClasses.includes(getEffectiveClass(l))
                );
                coTeachers = [...new Set(sameLessons.map(l => l.teacher))].sort().join(',');
            }

            let weekTag = '';
            if (lesson.week) {
                const w = lesson.week.toLowerCase();
                if (w.includes('odd') || w.includes('單') || w === '1') weekTag = ' (Odd)';
                else if (w.includes('even') || w.includes('雙') || w === '2') weekTag = ' (Even)';
                else weekTag = ` (${lesson.week})`;
            }

            return `<span style="color:blue;font-size:12px">${classDisplay} ${lesson.subject}${weekTag}<br></span><span style="color:#555;font-size:8px">${lesson.room}<br></span>${coTeachers ? `<span style="font-size:8px">(${coTeachers})</span>` : ''}`;
        }

            if (lesson.subject === 'MAUP') {
                return `<span class="subject" style="color:blue;font-size:14px;">${getEffectiveClass(lesson)} MAUP</span>`;

            const teacherSlotLessons = currentLessons.filter(
                l => l.day === lesson.day && 
                     l.period === lesson.period && 
                     l.subject === lesson.subject
            );

                : (teacherEffectiveClasses[0] || getEffectiveClass(lesson));

                );
                coTeachers = [...new Set(sameLessons.map(l => l.teacher))].sort().join(',');
            }

            let weekTag = '';
            if (lesson.week) {
                const w = lesson.week.toLowerCase();
                if (w.includes('odd') || w.includes('單') || w === '1') weekTag = ' (Odd)';
