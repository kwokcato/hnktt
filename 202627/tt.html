<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時間表查詢與 Excel 匯出</title>
    <!-- 引入 SheetJS (支持樣式的 xlsx-js-style 版本) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #107c41; /* Excel 綠色 */
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0b5a2f;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>教師時間表匯出系統</h2>
    <p>點擊下方按鈕即可將目前查詢的教師時間表匯出為 Excel 檔案：</p>
    <button onclick="exportToExcel()">匯出 Excel 時間表</button>
</div>

<script>
// =====================================================================
// 1. 全局狀態與測試數據示範 (請確保與您的實際資料變數對接)
// =====================================================================
let currentTitle = "CHAN T M 老師 的時間表";
let allLessons = [
    { day: 1, period: 1, class: "1A", subject: "CHI", teacher: "CHAN T M", room: "R101" },
    { day: 1, period: 2, class: "1A", subject: "PE", teacher: "CHAN T M", room: "PLAYGROUND" },
    { day: 1, period: 2, class: "1B", subject: "PE", teacher: "LEE K W", room: "PLAYGROUND" },
    { day: 2, period: 3, class: "2B", subject: "ENG", teacher: "CHAN T M", room: "R202" }
];
let currentLessons = [
    { day: 1, period: 1, class: "1A", subject: "CHI", teacher: "CHAN T M", room: "R101" },
    { day: 1, period: 2, class: "1A", subject: "PE", teacher: "CHAN T M", room: "PLAYGROUND" },
    { day: 2, period: 3, class: "2B", subject: "ENG", teacher: "CHAN T M", room: "R202" }
];

const timeSlots = [
    { period: "0", time: "8:05", endTime: "8:30", isBreak: true },
    { period: "1", time: "8:30", endTime: "9:30", isBreak: false },
    { period: "2", time: "9:30", endTime: "10:30", isBreak: false },
    { period: "3", time: "10:30", endTime: "10:55", isBreak: true },
    { period: "4", time: "10:55", endTime: "11:55", isBreak: false },
    { period: "5", time: "11:55", endTime: "12:55", isBreak: false },
    { period: "6", time: "12:55", endTime: "14:00", isBreak: true },
    { period: "7", time: "14:00", endTime: "15:00", isBreak: false }
];

// =====================================================================
// 2. 輔助函數
// =====================================================================
function simplifyClassNames(classList) {
    if (!classList || classList.length === 0) return '';
    return classList.join('/');
}

function toChinese12Hr(timeStr) {
    if (!timeStr) return '';
    const parts = timeStr.split(':');
    let h = parseInt(parts[0], 10);
    const m = parts[1] ? parts[1].padStart(2, '0') : '00';
    let period = '上午';
    if (h >= 12) {
        period = '下午';
        if (h > 12) h -= 12;
    }
    return `${period} ${h}:${m}`;
}

function getChineseBreakLabel(slot) {
    if (slot.time === '8:05') return '課前集會';
    if (slot.time === '10:30') return '小息';
    if (slot.time === '12:55') return '午膳';
    return slot.label || '';
}

// =====================================================================
// 3. 匯出 EXCEL 完整函數（教師查詢嚴格獨立三分行）
// =====================================================================
function exportToExcel() {
    if (!currentTitle || currentLessons.length === 0) {
        alert('請先查詢時間表');
        return;
    }

    if (typeof XLSX === 'undefined') {
        alert('Excel 匯出元件載入中，請稍候片刻再試。');
        return;
    }

    const wb = XLSX.utils.book_new();

    // Excel 樣式設定
    const borderBlack = {
        top: { style: "medium", color: { rgb: "000000" } },
        bottom: { style: "medium", color: { rgb: "000000" } },
        left: { style: "medium", color: { rgb: "000000" } },
        right: { style: "medium", color: { rgb: "000000" } }
    };

    const titleStyle = {
        font: { name: "Segoe UI", sz: 14, bold: true },
        alignment: { horizontal: "left", vertical: "center" }
    };

    const headerStyle = {
        font: { name: "Segoe UI", sz: 11, bold: true },
        alignment: { horizontal: "center", vertical: "center" },
        border: borderBlack,
        fill: { fgColor: { rgb: "FFFFFF" } }
    };

    const timeColStyle = {
        font: { name: "Segoe UI", sz: 10, bold: true },
        alignment: { horizontal: "center", vertical: "center", wrapText: true },
        border: borderBlack
    };

    const specialRowStyle = {
        font: { name: "Segoe UI", sz: 11, bold: true },
        alignment: { horizontal: "center", vertical: "center" },
        border: borderBlack
    };

    const cellStyle = {
        font: { name: "Segoe UI", sz: 10 },
        alignment: { horizontal: "center", vertical: "center", wrapText: true },
        border: borderBlack
    };

    const ws = {};
    const merges = [];
    const rowHeights = [];

    // 處理標題名稱
    let titleName = currentTitle;
    if (currentTitle.includes(' 的時間表')) {
        titleName = currentTitle.split(' 的時間表')[0].replace('班別 ', '');
    }

    // Row 0 (Excel A1): 標題
    ws["A1"] = { v: `時間表: ${titleName}`, s: titleStyle };
    merges.push({ s: { r: 0, c: 0 }, e: { r: 0, c: 5 } });
    rowHeights.push({ hpt: 28 });

    // Row 1 (Excel A2): 表頭
    const headers = ["", "星期一", "星期二", "星期三", "星期四", "星期五"];
    headers.forEach((h, colIdx) => {
        const cellRef = XLSX.utils.encode_cell({ r: 1, c: colIdx });
        ws[cellRef] = { v: h, s: headerStyle };
    });
    rowHeights.push({ hpt: 24 });

    const isClassQuery = currentTitle.includes('班別');

    // 課堂單元格內容格式化（嚴格獨立三分行）
    function formatLessonCellForExcel(dayLessons, day, slotPeriod) {
        if (!dayLessons || dayLessons.length === 0) {
            if (day === 3 && slotPeriod === '10') {
                return '下午 2:40 - 下午 3:30\n(CPA)';
            }
            return '';
        }

        const lines = [];

        if (day === 3 && slotPeriod === '10') {
            lines.push('下午 2:40 - 下午 3:30');
        }

        if (isClassQuery) {
            // ------------------------------------
            // 1. 班別查詢 Excel 格式
            // ------------------------------------
            const teachers = [...new Set(dayLessons.map(l => l.teacher))].join(',');
            const rooms = [...new Set(dayLessons.filter(l => l.room).map(l => l.room))].join(',');
            const hasMaup = dayLessons.some(l => l.subject === 'MAUP');
            const hasChem = dayLessons.some(l => l.subject.includes('CHEM'));
            const hasIct = dayLessons.some(l => l.subject.includes('ICT'));
            const hasPHY = dayLessons.some(l => l.subject.includes('PHY'));

            if (hasChem && hasIct) {
                lines.push('X2/X3');
                if (rooms) lines.push(rooms);
                if (teachers) lines.push(`(${teachers})`);
            } else if (hasChem && slotPeriod !== '10') {
                lines.push('X2');
                if (rooms) lines.push(rooms);
                if (teachers) lines.push(`(${teachers})`);
            } else if (hasIct && slotPeriod !== '10') {
                lines.push('X3');
                if (rooms) lines.push(rooms);
                if (teachers) lines.push(`(${teachers})`);
            } else if (hasPHY && slotPeriod !== '10') {
                lines.push('X1');
                if (rooms) lines.push(rooms);
                if (teachers) lines.push(`(${teachers})`);
            } else if (hasMaup) {
                lines.push('MAUP');
                if (teachers) lines.push(`(${teachers})`);
            } else if (slotPeriod === '10' && currentTitle.includes('班別') && /^[6][A-D]$/i.test(currentTitle.split(' ')[1])) {
                const subjects = [...new Set(dayLessons.map(l => l.subject))].join(' / ');
                lines.push('Make-up Classes');
                lines.push(subjects);
            } else {
                const subjects = [...new Set(dayLessons.map(l => l.subject))].join('/');
                lines.push(subjects);
                if (rooms) lines.push(rooms);
                if (teachers) lines.push(`(${teachers})`);
            }
        } else {
            // ------------------------------------
            // 2. 教師查詢 Excel 格式（嚴格三分行獨立）
            // 第一行：班別 + 科目
            // 第二行：教師姓名
            // 第三行：房間地點
            // ------------------------------------
            const firstLesson = dayLessons[0];
            const isPE = firstLesson.subject === 'PE';
            const isMaup = firstLesson.subject === 'MAUP';

            let subjectLine = '';
            let teacherLine = '';
            let roomLine = '';

            if (isPE) {
                const allPELessons = allLessons.filter(
                    l => l.day === day && l.period === parseInt(slotPeriod) && l.subject === 'PE'
                );
                const allClasses = [...new Set(allPELessons.map(l => l.class))].sort();
                const classDisplay = simplifyClassNames(allClasses);
                const allTeachers = [...new Set(allPELessons.map(l => l.teacher))].filter(Boolean).sort();

                subjectLine = `${classDisplay} PE`;
                teacherLine = allTeachers.join(', ');
                roomLine = [...new Set(allPELessons.map(l => l.room))].filter(Boolean).join(', ');

            } else if (isMaup) {
                subjectLine = `${firstLesson.class} MAUP`;
                teacherLine = firstLesson.teacher || '';
                roomLine = firstLesson.room || '';

            } else {
                const noCoTeacherSubjects = ['ARD', 'CPA', 'READ', 'MAUP'];
                const shouldShowCoTeachers = !noCoTeacherSubjects.includes(firstLesson.subject);

                const sameLessons = allLessons.filter(
                    l => l.day === day &&
                         l.period === parseInt(slotPeriod) &&
                         l.class === firstLesson.class &&
                         l.subject === firstLesson.subject
                );

                const groupedLessons = allLessons.filter(
                    l => l.day === day &&
                         l.period === parseInt(slotPeriod) &&
                         l.subject === firstLesson.subject &&
                         l.teacher === firstLesson.teacher
                );

                let classDisplay = firstLesson.class;
                if (groupedLessons.length > 1) {
                    const allClasses = [...new Set(groupedLessons.map(l => l.class))].sort();
                    classDisplay = simplifyClassNames(allClasses);
                }

                // 第一行：班別 + 科目
                subjectLine = `${classDisplay} ${firstLesson.subject}`;

                // 第二行：教師姓名
                if (shouldShowCoTeachers && sameLessons.length > 0) {
                    const teachers = [...new Set(sameLessons.map(l => l.teacher))].filter(Boolean);
                    if (firstLesson.teacher && !teachers.includes(firstLesson.teacher)) {
                        teachers.unshift(firstLesson.teacher);
                    }
                    teacherLine = teachers.join(', ');
                } else {
                    teacherLine = firstLesson.teacher || '';
                }

                // 第三行：房間地點
                roomLine = [...new Set(sameLessons.map(l => l.room))].filter(Boolean).join(', ');
                if (!roomLine) roomLine = firstLesson.room || '';
            }

            // 依序推入，保持「行與行獨立」，無資料時跳過
            if (subjectLine) lines.push(subjectLine);
            if (teacherLine) lines.push(teacherLine);
            if (roomLine) lines.push(roomLine);
        }

        return lines.join('\n');
    }

    let currentR = 2; // 從第 3 列 (A3) 開始填寫資料

    timeSlots.forEach(slot => {
        const start12 = toChinese12Hr(slot.time);
        const end12 = toChinese12Hr(slot.endTime);
        const formattedTime = `${start12}\n-${end12}`;

        // 第一欄：時間欄
        const timeCellRef = XLSX.utils.encode_cell({ r: currentR, c: 0 });
        ws[timeCellRef] = { v: formattedTime, s: timeColStyle };

        if (slot.isBreak) {
            const label = getChineseBreakLabel(slot);
            const bRef = XLSX.utils.encode_cell({ r: currentR, c: 1 });
            ws[bRef] = { v: label, s: specialRowStyle };

            for (let c = 2; c <= 5; c++) {
                const cellRef = XLSX.utils.encode_cell({ r: currentR, c: c });
                ws[cellRef] = { v: "", s: specialRowStyle };
            }
            merges.push({ s: { r: currentR, c: 1 }, e: { r: currentR, c: 5 } });
            rowHeights.push({ hpt: 22 });
        } else {
            for (let day = 1; day <= 5; day++) {
                const dayLessons = currentLessons.filter(
                    lesson => lesson.day === day && lesson.period === parseInt(slot.period)
                );
                const cellText = formatLessonCellForExcel(dayLessons, day, slot.period);
                const cellRef = XLSX.utils.encode_cell({ r: currentR, c: day });
                ws[cellRef] = { v: cellText, s: cellStyle };
            }
            rowHeights.push({ hpt: 55 }); // 給予足夠高層容納三行
        }

        currentR++;
    });

    ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: currentR - 1, c: 5 } });
    ws['!merges'] = merges;
    ws['!cols'] = [{ wch: 18 }, { wch: 20 }, { wch: 20 }, { wch: 20 }, { wch: 20 }, { wch: 20 }];
    ws['!rows'] = rowHeights;

    XLSX.utils.book_append_sheet(wb, ws, '時間表');

    const cleanTitle = currentTitle.split(' (')[0];
    XLSX.writeFile(wb, `${cleanTitle}.xlsx`);
}
</script>

</body>
</html>
