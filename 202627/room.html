<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <title>房間查詢系統</title>
    
    <!-- 引入原生 Excel (.xlsx) 產生套件（支援邊框與換行樣式） -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

    <script>
    // *** 請在這裡設定貴校的 Google Workspace 網域名稱 ***
    const SCHOOL_DOMAIN = "bhnkc.edu.hk"; // 假設的網域名稱，請務必修改

    // 解碼 JWT
    function decodeJwtResponse(token) {
        try {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        } catch (e) {
            return null;
        }
    }

    // 檢查 sessionStorage 中是否有有效的登入憑證
    const id_token = window.sessionStorage.getItem('google_id_token');
    let is_authenticated = false;

    if (id_token) {
        const payload = decodeJwtResponse(id_token);
        if (payload && payload.hd === SCHOOL_DOMAIN && payload.exp && (payload.exp * 1000) > Date.now()) {
            is_authenticated = true;
        }
    }

    // if (!is_authenticated) {
    //     window.top.location.href = 'index.html';
    // }
    </script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

            color: #2c3e50;
            margin-bottom: 20px;
        }

        .container {
            background-color: #fff;
            padding: 30px;

        .tab-button {

        .tab-button.active {

        }

        .tab-content.active {

        .form-group {

        }

        label {
            display: block;

        }

        select, input[type="text"] {
            width: 100%;
            padding: 10px;

        }

        #roomSelect {
            width: 100%;
        }

        table {
            width: 100%;

            margin-top: 20px;
            background-color: #fff;
        }

        th, td {

        }

        th {
            background-color: #34495e;

        }

        tr:nth-child(even) {

        .status-message {

            display: none;

        .status-message.success {

        .status-message.error {
            background-color: #f8d7da;

        }

        .status-message.info {
            background-color: #d1ecf1;

            border: 1px solid #bee5eb;
        }

        .rooms-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: flex-start;
        }

        .room-name {
            background-color: #ecf0f1;
            padding: 6px 12px;

            cursor: pointer;
            transition: all 0.2s ease;

        .room-name:hover {

        .room-name.highlight-room {

        .refresh-btn {
            position: fixed;

            display: flex;

            transition: all 0.3s ease;

        .refresh-btn:hover {
            background-color: rgba(200, 200, 200, 0.7);
            transform: scale(1.1);
        }
        
        .refresh-icon {
            width: 16px;
            height: 16px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23333333"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>');
            background-size: contain;
            opacity: 0.7;
        }

        /* 列印按鈕樣式 */
        .print-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.2s ease;
        }

        .print-btn:hover {
            background-color: #219150;
        }

        /* Excel 按鈕樣式 */
        .excel-btn {
            background-color: #107c41;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.2s ease;
        }

        .excel-btn:hover {
            background-color: #0b5a2f;
        }

        #printArea {
            display: none;
        }

        /* =====================================================================
           列印模式 CSS
           ===================================================================== */
        @media print {
            body * {
                visibility: hidden;
            }

            #printArea, #printArea * {
                visibility: visible;
            }

            #printArea {
                display: block !important;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background: #fff;
                padding: 0;
                margin: 0;
            }

            @page {
                size: A4 portrait;
                margin: 10mm 8mm;

            .print-title {
                font-size: 18px;

                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, 'Microsoft JhengHei', sans-serif;

                color: #000;

            .print-table {
                width: 100%;
                border-collapse: collapse;

            }

            .print-table .time-col {

            .print-table .special-row {

        }
    </style>
</head>
<body oncontextmenu="return false;">

        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I') || (e.ctrlKey && e.key === 'u') || (e.ctrlKey && e.shiftKey && e.key === 'J')) {
                e.preventDefault();
            }
        });

    <div class="refresh-btn" title="重整頁面" id="pageRefreshBtn">
        <div class="refresh-icon"></div>
    </div>

    <div id="printArea"></div>

    <div class="container">
        <h1>房間查詢系統</h1>

        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('roomTab')">按房間查詢</button>
            <button class="tab-button" onclick="switchTab('freeRoomsTab')">查詢閒置房間</button>
        </div>

        <div id="statusMessage" class="status-message"></div>

        <div id="roomTab" class="tab-content active">
            <div class="form-group" style="display: flex; align-items: flex-end; gap: 15px;">
                <div style="width: 30%;">
                    <label for="roomSelect">選擇房間：</label>
                    <select id="roomSelect">
                        <option value="">-- 請選擇房間 --</option>
                    </select>
                </div>
                <button id="printBtn" class="print-btn" onclick="printRoomTimetable()">列印時間表</button>
                <button id="excelBtn" class="excel-btn" onclick="exportToExcel()">匯出 EXCEL</button>
            </div>
            <table id="timetableTable" style="display: none;">
                <thead>
                    <tr>
                        <th>節數</th>
                        <th>星期一</th>
                        <th>星期二</th>
                        <th>星期三</th>
                        <th>星期四</th>
                        <th>星期五</th>
                    </tr>
                </thead>
                <tbody id="timetableBody">
                </tbody>
            </table>
        </div>

        <div id="freeRoomsTab" class="tab-content">
            <div class="form-group" style="display: flex; gap: 20px;">
                <div style="flex: 1;">
                    <label for="weekdaySelect">選擇星期：</label>
                    <select id="weekdaySelect">
                        <option value="">-- 請選擇星期 --</option>
                        <option value="1">星期一</option>
                        <option value="2">星期二</option>
                        <option value="3">星期三</option>
                        <option value="4">星期四</option>
                        <option value="5">星期五</option>
                    </select>
                </div>
            </div>
            
            <div id="freeRoomsStatusMessage" class="status-message"></div>

            <table id="freeRoomsTable" style="display: none;">
                <thead>
                    <tr>
                        <th style="width: 150px;">節數</th>
                        <th>閒置房間（滑鼠移入可自動高亮相同房間）</th>
                    </tr>
                </thead>
                <tbody id="freeRoomsBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let timetableData = [];
        let uniqueRooms = [];
        const weekdayNames = { 1: '星期一', 2: '星期二', 3: '星期三', 4: '星期四', 5: '星期五' };

        const scheduleStructure = [
            { type: 'special', time: '上午 8:05 - 上午 8:20', label: '課前集會' },
            { type: 'period', period: 1, time: '上午 8:20 - 上午 8:55' },
            { type: 'period', period: 2, time: '上午 8:55 - 上午 9:30' },
            { type: 'special', time: '上午 9:30 - 上午 9:45', label: '小息' },
            { type: 'period', period: 3, time: '上午 9:45 - 上午 10:20' },
            { type: 'period', period: 4, time: '上午 10:20 - 上午 10:55' },
            { type: 'special', time: '上午 10:55 - 上午 11:10', label: '小息' },
            { type: 'period', period: 5, time: '上午 11:10 - 上午 11:45' },
            { type: 'period', period: 6, time: '上午 11:45 - 下午 12:20' },
            { type: 'period', period: 7, time: '下午 12:20 - 下午 12:55' },
            { type: 'special', time: '下午 12:55 - 下午 2:00', label: '午膳' },
            { type: 'special', time: '下午 2:00 - 下午 2:05', label: '午間宣佈' },
            { type: 'period', period: 8, time: '下午 2:05 - 下午 2:40' },
            { type: 'period', period: 9, time: '下午 2:40 - 下午 3:15' },
            { type: 'period', period: 10, time: '下午 3:15 - 下午 3:50' }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            initDefaultWeekday();
            loadCSV();

            document.getElementById('roomSelect').addEventListener('change', onRoomChange);
            document.getElementById('weekdaySelect').addEventListener('change', onWeekdayChange);
            
            document.getElementById('pageRefreshBtn').addEventListener('click', function() {
                this.style.transform = 'scale(1.2) rotate(360deg)';
                this.style.backgroundColor = 'rgba(150, 150, 150, 0.8)';
                loadCSV();
                setTimeout(() => {
                    this.style.transform = '';
                    this.style.backgroundColor = '';
                }, 500);
            });
        });

        function initDefaultWeekday() {
            let currentDay = new Date().getDay();
            if (currentDay === 0 || currentDay === 6) {
                currentDay = 1;
            }
            document.getElementById('weekdaySelect').value = currentDay;
        }

        window.handleTTSheetResponse = function(jsonData) {
            try {
                let csvText = "";
                if (jsonData && jsonData.table && jsonData.table.rows) {
                    jsonData.table.rows.forEach(row => {
                        if (row.c) {
                            let rowCells = row.c.map(cell => {
                                if (!cell) return "";
                                return cell.v !== null && cell.v !== undefined ? String(cell.v).replace(/,/g, '') : "";
                            });
                            csvText += rowCells.join(",") + "\n";
                        }
                    });
                }
                processCSVData(csvText);
            } catch (e) {
                console.error('解析課表試算表錯誤:', e);
                showStatus('無法解析雲端課表數據', 'error');
            }
        };

        function loadCSV() {
            showStatus('正在載入最新雲端數據...', 'info');
            
            document.getElementById('timetableTable').style.display = 'none';
            document.getElementById('freeRoomsTable').style.display = 'none';
            document.getElementById('roomSelect').selectedIndex = 0;
            document.getElementById('freeRoomsStatusMessage').style.display = 'none';

            if (!document.getElementById('weekdaySelect').value) {
                initDefaultWeekday();
            }

            try {
                const ttSheetId = '10TdramDTMZLQxl-jShrZeYJLCTtq0iu98PVPb-sZXyU';
                const cacheBuster = Date.now();

                const oldScriptTT = document.getElementById('script_tt_jsonp');
                if (oldScriptTT) oldScriptTT.remove();

                const scriptTT = document.createElement('script');
                scriptTT.id = 'script_tt_jsonp';
                scriptTT.src = `https://docs.google.com/spreadsheets/d/${ttSheetId}/gviz/tq?tqx=responseHandler:handleTTSheetResponse&t=${cacheBuster}`;
                scriptTT.onerror = () => { throw new Error("主課表加載失敗"); };
                document.head.appendChild(scriptTT);

            } catch (error) {
                console.error('載入雲端試算表失敗:', error);
                showStatus('無法載入雲端數據，請確認網路連線。', 'error');
            }
        }

        function processCSVData(csvText) {
            if (csvText.startsWith('\uFEFF')) {
                csvText = csvText.substring(1);
            }

            const lines = csvText.split('\n');
            timetableData = [];
            const roomsSet = new Set();

            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const columns = line.split(',');
                if (columns.length >= 7) {
                    const week = parseInt(columns[1].trim());
                    const period = parseInt(columns[2].trim());
                    const teacher = columns[3].trim();
                    const className = columns[4].trim();
                    const subject = columns[5].trim();
                    const room = columns[6].trim();

                    if (!isNaN(week) && !isNaN(period) && room) {
                        timetableData.push({ week, period, teacher, className, subject, room });
                        roomsSet.add(room);
                    }
                }
            }

            uniqueRooms = Array.from(roomsSet).sort((a, b) => a.localeCompare(b, 'zh-Hant'));
            populateRoomSelect();
            onWeekdayChange();
            showStatus('成功載入最新雲端數據！請選擇上方功能進行查詢。', 'success');
        }

        function populateRoomSelect() {
            const select = document.getElementById('roomSelect');
            select.innerHTML = '<option value="">-- 請選擇房間 --</option>';

            uniqueRooms.forEach(room => {
                const option = document.createElement('option');
                option.value = room;
                option.textContent = room;
                select.appendChild(option);
            });
        }

        function switchTab(tabId) {
            const buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(content => content.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');

            document.getElementById('statusMessage').style.display = 'none';
        }

        function onRoomChange() {
            const selectedRoom = document.getElementById('roomSelect').value;
            const table = document.getElementById('timetableTable');
            const tbody = document.getElementById('timetableBody');
            
            tbody.innerHTML = '';

            if (!selectedRoom) {
                table.style.display = 'none';
                return;
            }

            table.style.display = 'table';

            for (let i = 1; i <= 10; i++) {
                const row = tbody.insertRow();
                const periodCell = row.insertCell(0);
                periodCell.textContent = `第 ${i} 節`;
                periodCell.style.fontWeight = 'bold';
                periodCell.style.backgroundColor = '#f4f7f6';

                for (let j = 1; j <= 5; j++) {
                    const cell = row.insertCell(j);
                    
                    if (j === 3 && i === 10) {
                        cell.textContent = '-';
                        cell.style.backgroundColor = '#eaeedf';
                        continue;
                    }

                    const detailsArray = getCellContentForRoom(selectedRoom, j, i);
                    if (detailsArray && detailsArray.length > 0) {
                        cell.innerHTML = detailsArray.join('<br>');
                    } else {
                        cell.textContent = '';
                    }
                }

                if (i === 2 || i === 4 || i === 7) {
                    const separatorRow = tbody.insertRow();
                    separatorRow.className = 'separator-row';
                    for (let k = 0; k <= 5; k++) {
                        const cell = separatorRow.insertCell(k);
                        if (k === 0) {
                            if (i === 2) cell.textContent = '第一小息';
                            else if (i === 4) cell.textContent = '第二小息';
                            else if (i === 7) cell.textContent = '午膳時間';
                            cell.style.fontSize = '12px';
                            cell.style.color = '#7f8c8d';
                            cell.style.fontWeight = 'bold';
                        }
                    }
                }
            }
            
            showStatus(`成功找到 「${selectedRoom}」 的房間時間表`, 'success');
        }

        function onWeekdayChange() {
            const weekday = parseInt(document.getElementById('weekdaySelect').value);
            const table = document.getElementById('freeRoomsTable');
            const tableBody = document.getElementById('freeRoomsBody');
            
            tableBody.innerHTML = '';

            if (isNaN(weekday)) {
                table.style.display = 'none';
                document.getElementById('freeRoomsStatusMessage').style.display = 'none';
                return;
            }

            table.style.display = 'table';

            for (let i = 1; i <= 10; i++) {
                const row = tableBody.insertRow();
                
                const periodCell = row.insertCell(0);
                periodCell.textContent = `第 ${i} 節`;
                periodCell.style.fontWeight = 'bold';
                periodCell.style.backgroundColor = '#f4f7f6';

                const roomsCell = row.insertCell(1);
                roomsCell.style.textAlign = 'left';

                if (weekday === 3 && i === 10) {
                    roomsCell.textContent = '（全校不排課時間）';
                    roomsCell.style.color = '#7f8c8d';
                    roomsCell.style.fontStyle = 'italic';
                    continue;
                }

                const occupiedRooms = new Set(
                    timetableData.filter(d => d.week === weekday && d.period === i).map(d => d.room)
                );

                const freeRooms = uniqueRooms.filter(room => !occupiedRooms.has(room));

                if (freeRooms.length > 0) {
                    const gridDiv = document.createElement('div');
                    gridDiv.className = 'rooms-grid';

                    freeRooms.forEach(room => {
                        const roomSpan = document.createElement('span');
                        roomSpan.className = 'room-name';
                        roomSpan.textContent = room;
                        
                        roomSpan.addEventListener('mouseover', () => { highlightAllRooms(room); });
                        roomSpan.addEventListener('mouseout', () => { removeAllHighlights(); });

                        gridDiv.appendChild(roomSpan);
                    });
                    roomsCell.appendChild(gridDiv);
                } else {
                    roomsCell.textContent = '無閒置房間';
                }
                
                if (i === 2 || i === 4 || i === 7) {
                    const separatorRow = tableBody.insertRow();
                    separatorRow.insertCell(0).colSpan = 2;
                    separatorRow.insertCell(0).style.border = 'none';
                }
            }
            
            showStatus(`成功找到 「${weekdayNames[weekday]}」 的閒置房間資訊`, 'success', 'freeRoomsStatusMessage');
        }
        
        function highlightAllRooms(roomName) {
            const roomSpans = document.querySelectorAll('#freeRoomsTable .room-name');
            roomSpans.forEach(span => {
                if (span.textContent === roomName) {
                    span.classList.add('highlight-room');
                }
            });
        }
        
        function removeAllHighlights() {
            const highlightedSpans = document.querySelectorAll('#freeRoomsTable .highlight-room');
            highlightedSpans.forEach(span => {
                span.classList.remove('highlight-room');
            });
        }
        
        function showStatus(message, type, elementId = 'statusMessage') {
            const statusElement = document.getElementById(elementId);
            statusElement.textContent = message;
            statusElement.className = `status-message ${type}`;
            statusElement.style.display = 'block';
        }

        // 獲取指定房間、星期與節數的內容陣列（已移除儲存格內的房間名稱）
        function getCellContentForRoom(room, day, period) {
            const lessons = timetableData.filter(d => d.room === room && d.week === day && d.period === period);

            if (lessons.length === 0) return [];

            const subjectGroups = {};
            lessons.forEach(l => {
                if (!subjectGroups[l.subject]) {
                    subjectGroups[l.subject] = {
                        subject: l.subject,
                        classes: [],
                        teachers: []
                    };
                }
                let classLetter = l.className;
                const match = l.className.match(/^\d+([A-Za-z]+)$/);
                if (match) {
                    classLetter = match[1];
                }
                
                subjectGroups[l.subject].classes.push({ letter: classLetter, full: l.className });
                if (l.teacher) {
                    subjectGroups[l.subject].teachers.push(l.teacher);
                }
            });

            return Object.values(subjectGroups).map(group => {
                const uniqueFullClasses = Array.from(new Set(group.classes.map(c => c.full)));
                const matchFirst = group.classes[0].full.match(/^(\d+)[A-Za-z]+$/);
                
                let mergedClassName = uniqueFullClasses.join('/');
                if (matchFirst) {
                    const grade = matchFirst[1];
                    const allSameGrade = group.classes.every(c => c.full.startsWith(grade));
                    if (allSameGrade) {
                        const letters = Array.from(new Set(group.classes.map(c => c.letter))).sort().join('');
                        mergedClassName = grade + letters;
                    }
                }
                
                const uniqueTeachers = Array.from(new Set(group.teachers.filter(t => t)));
                const teacherStr = uniqueTeachers.join(',');

                let itemStr = `${mergedClassName} ${group.subject}`;
                if (teacherStr) {
                    itemStr += ` ${teacherStr}`;
                }
                // 時間表內部儲存格不再顯示房間名稱
                return itemStr;
            });
        }

        // =====================================================================
        // 列印功能函數
        // =====================================================================
        function printRoomTimetable() {
            const selectedRoom = document.getElementById('roomSelect').value;
            if (!selectedRoom) {
                alert('請先選擇房間！');
                return;
            }

            const printArea = document.getElementById('printArea');

            let html = `<div class="print-title">時間表: ${selectedRoom}</div>`;
            html += `<table class="print-table">`;
            html += `<thead>
                <tr>
                    <th class="time-col"></th>
                    <th>星期一</th>
                    <th>星期二</th>
                    <th>星期三</th>
                    <th>星期四</th>
                    <th>星期五</th>
                </tr>
            </thead>`;
            html += `<tbody>`;

            scheduleStructure.forEach(rowInfo => {
                const timeLabel = rowInfo.time.replace(' - ', '<br>-');
                html += `<tr>`;
                html += `<td class="time-col">${timeLabel}</td>`;

                if (rowInfo.type === 'special') {
                    html += `<td colspan="5" class="special-row">${rowInfo.label}</td>`;
                } else {
                    const p = rowInfo.period;
                    for (let day = 1; day <= 5; day++) {
                        const detailsArray = getCellContentForRoom(selectedRoom, day, p);
                        html += `<td>${detailsArray ? detailsArray.join('<br>') : ''}</td>`;
                    }
                }
                html += `</tr>`;
            });

            html += `</tbody></table>`;
            printArea.innerHTML = html;

            window.print();
        }

        // =====================================================================
        // 匯出 EXCEL 功能
        // =====================================================================
        function exportToExcel() {
            const selectedRoom = document.getElementById('roomSelect').value;
            if (!selectedRoom) {
                alert('請先選擇房間！');
                return;
            }

            if (typeof XLSX === 'undefined') {
                alert('Excel 匯出元件載入中，請稍候片刻再試。');
                return;
            }

            const wb = XLSX.utils.book_new();

            const borderBlack = {
                top: { style: "medium", color: { rgb: "000000" } },
                bottom: { style: "medium", color: { rgb: "000000" } },
                left: { style: "medium", color: { rgb: "000000" } },
                right: { style: "medium", color: { rgb: "000000" } }
            };

            const titleStyle = {
                font: { name: "Segoe UI", sz: 14, bold: true },
                alignment: { horizontal: "left", vertical: "center" }
            };

            const headerStyle = {
                font: { name: "Segoe UI", sz: 11, bold: true },
                alignment: { horizontal: "center", vertical: "center" },
                border: borderBlack,
                fill: { fgColor: { rgb: "FFFFFF" } }
            };

            const timeColStyle = {
                font: { name: "Segoe UI", sz: 10, bold: true },
                alignment: { horizontal: "center", vertical: "center", wrapText: true },
                border: borderBlack
            };

            const specialRowStyle = {
                font: { name: "Segoe UI", sz: 11, bold: true },
                alignment: { horizontal: "center", vertical: "center" },
                border: borderBlack
            };

            const cellStyle = {
                font: { name: "Segoe UI", sz: 10 },
                alignment: { horizontal: "center", vertical: "center", wrapText: true },
                border: borderBlack
            };

            const ws = {};
            const merges = [];

            // Row 0: 標題 ("時間表: [房間名稱]")
            ws["A1"] = { v: `時間表: ${selectedRoom}`, s: titleStyle };
            merges.push({ s: { r: 0, c: 0 }, e: { r: 0, c: 5 } });

            // Row 1: 表頭 (星期一 至 星期五)
            const headers = ["", "星期一", "星期二", "星期三", "星期四", "星期五"];
            headers.forEach((h, colIdx) => {
                const cellRef = XLSX.utils.encode_cell({ r: 1, c: colIdx });
                ws[cellRef] = { v: h, s: headerStyle };
            });

            let currentR = 2;

            scheduleStructure.forEach(rowInfo => {
                const formattedTime = rowInfo.time.replace(' - ', '\n- ');
                const timeCellRef = XLSX.utils.encode_cell({ r: currentR, c: 0 });
                ws[timeCellRef] = { v: formattedTime, s: timeColStyle };

                if (rowInfo.type === 'special') {
                    const specialCellRef = XLSX.utils.encode_cell({ r: currentR, c: 1 });
                    ws[specialCellRef] = { v: rowInfo.label, s: specialRowStyle };

                    for (let c = 2; c <= 5; c++) {
                        const emptyRef = XLSX.utils.encode_cell({ r: currentR, c: c });
                        ws[emptyRef] = { v: "", s: specialRowStyle };
                    }
                    merges.push({ s: { r: currentR, c: 1 }, e: { r: currentR, c: 5 } });
                } else {
                    const p = rowInfo.period;
                    for (let day = 1; day <= 5; day++) {
                        const cellRef = XLSX.utils.encode_cell({ r: currentR, c: day });
                        const detailsArray = getCellContentForRoom(selectedRoom, day, p);
                        
                        const cellText = (detailsArray && detailsArray.length > 0) ? detailsArray.join('\n') : '';
                        ws[cellRef] = { v: cellText, s: cellStyle };
                    }
                }
                currentR++;
            });

            ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: currentR - 1, c: 5 } });
            ws['!merges'] = merges;
            ws['!cols'] = [{ wch: 18 }, { wch: 20 }, { wch: 20 }, { wch: 20 }, { wch: 20 }, { wch: 20 }];

            const rowHeights = [{ hpt: 28 }, { hpt: 24 }];
            scheduleStructure.forEach(rowInfo => {
                rowHeights.push({ hpt: rowInfo.type === 'special' ? 22 : 45 });
            });
            ws['!rows'] = rowHeights;

            XLSX.utils.book_append_sheet(wb, ws, selectedRoom);

            XLSX.writeFile(wb, `房間時間表_${selectedRoom}.xlsx`);
        }
    </script>
