<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教師調堂/代堂自動配對系統</title>
    <style>
        body { font-family: Arial, sans-serif; width: 95%; margin: 0 auto; padding: 15px; background: #fafafa; }
        .container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        h2 { color: #2c3e50; border-bottom: 2px solid #e67e22; padding-bottom: 8px; margin-top: 0; }
        
        /* 溫馨提示區塊 */
        .system-notice {
            background-color: #fffbe6;
            border: 1px solid #ffe58f;
            color: #d46b08;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-section { background: #fdf8f6; padding: 15px; border-radius: 6px; border: 1px solid #fbe5d6; margin-bottom: 20px; }
        .filter-row { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; margin-bottom: 12px; }
        label { font-weight: bold; color: #34495e; font-size: 14px; }
        select, input { padding: 6px 10px; border-radius: 4px; border: 1px solid #cbd5e1; font-size: 14px; }
        
        .checkbox-group { display: flex; gap: 8px; flex-wrap: wrap; background: #fff; padding: 6px 10px; border-radius: 4px; border: 1px solid #cbd5e1; }
        .btn-swap { background-color: #e67e22; color: white; border: none; padding: 8px 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .btn-swap:hover { background-color: #d35400; }
        
        .results-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        .results-table th, .results-table td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; }
        .results-table th { background-color: #e67e22; color: white; }
        .highlight { background-color: #fef3c7; font-weight: bold; padding: 2px 6px; border-radius: 4px; color: #b45309; }
        .badge-room { background: #0284c7; color: white; padding: 2px 8px; border-radius: 12px; font-size: 12px; display: inline-block; }
        .badge-ok { background: #16a34a; color: white; padding: 2px 8px; border-radius: 12px; font-size: 12px; display: inline-block; }
        .badge-workload { background: #64748b; color: white; padding: 2px 8px; border-radius: 12px; font-size: 12px; display: inline-block; margin-bottom: 3px; }
        .badge-heavy { background: #e11d48; color: white; padding: 2px 8px; border-radius: 12px; font-size: 12px; display: inline-block; margin-bottom: 3px; }
        .badge-group { background: #8b5cf6; color: white; padding: 2px 8px; border-radius: 12px; font-size: 12px; display: inline-block; }
        .badge-subject { background: #d97706; color: white; padding: 2px 8px; border-radius: 12px; font-size: 12px; display: inline-block; margin-right: 4px; }
        
        .warning-box { padding: 15px; background: #f8d7da; color: #721c24; border-radius: 4px; border: 1px solid #f5c6cb; margin-top: 10px; }
        .info-box { padding: 15px; background: #fff3cd; color: #856404; border-radius: 4px; border: 1px solid #ffeeba; margin-top: 10px; }
        .co-teacher-alert { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; padding: 12px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; }
        #loading { color: #7f8c8d; font-style: italic; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔄 同班別「調堂/對換」自動配對系統</h2>
    
    <!-- 📌 新增的溫馨提示標語 -->
    <div class="system-notice">
        📌 <strong>溫馨提示：</strong>本系統配對結果僅供參考，最終調堂方案必須與相關受影響教師溝通並達成共識後，始可提出申請。
    </div>

    <div id="loading">正在連線至雲端資料庫讀取課表...</div>

    <div class="filter-section">
        <div class="filter-row">
            <label for="myTeacherSelect">1. 你的姓名（申請人）：</label>
            <select id="myTeacherSelect"><option value="">-- 請選擇教師 --</option></select>

            <label for="targetClassSelect">2. 目標班別：</label>
            <select id="targetClassSelect"><option value="">-- 請選擇班別 --</option></select>
        </div>

        <div class="filter-row">
            <label for="myDaySelect">3. 原定課堂星期：</label>
            <select id="myDaySelect">
                <option value="" selected>-- 請選擇星期 --</option>
                <option value="1">星期一</option>
                <option value="2">星期二</option>
                <option value="3">星期三</option>
                <option value="4">星期四</option>
                <option value="5">星期五</option>
            </select>

            <label>4. 缺席連堂時段（請勾選連續節數）：</label>
            <div class="checkbox-group">
                <label><input type="checkbox" class="my-p-chk" value="1"> 1</label>
                <label><input type="checkbox" class="my-p-chk" value="2"> 2</label>
                <label><input type="checkbox" class="my-p-chk" value="3"> 3</label>
                <label><input type="checkbox" class="my-p-chk" value="4"> 4</label>
                <label><input type="checkbox" class="my-p-chk" value="5"> 5</label>
                <label><input type="checkbox" class="my-p-chk" value="6"> 6</label>
                <label><input type="checkbox" class="my-p-chk" value="7"> 7</label>
                <label><input type="checkbox" class="my-p-chk" value="8"> 8</label>
                <label><input type="checkbox" class="my-p-chk" value="9"> 9</label>
                <label><input type="checkbox" class="my-p-chk" value="10"> 10</label>
            </div>

            <button id="searchSwapBtn" class="btn-swap">🔍 尋找可調堂對象</button>
        </div>
    </div>

    <div id="swapResults"></div>
</div>

<script>
let allLessons = [];
let allTeachers = [];
let allClasses = [];
const dayNames = ["", "星期一", "星期二", "星期三", "星期四", "星期五"];

// 🚫 不可調堂黑名單（已移除 GEOG 及 HIST，改由動態邏輯判斷年級）
const prohibitedSubjects = [
    "READ", "PLM", "ARD", "PE", 
    "BIO", "PHY", "CHEM", "BM", "ACC", "HMSC", "THS", "THS3", 
    "VAD", "VAD3", "ICT", "ERS", "ERS3", "BIO3", 
    "CHIS", "ECON", "ASOS", "MAM2"
];

// 高中（中四至中六）不可調堂的選修科目
const seniorElectiveSubjects = ["GEOG", "HIST"];

// Google Sheet 載入與解析
function loadGoogleSheetData() {
    const sheetId = '10TdramDTMZLQxl-jShrZeYJLCTtq0iu98PVPb-sZXyU';
    const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:handleGoogleSheetResponse&t=${Date.now()}`;
    const script = document.createElement('script');
    script.src = url;
    document.head.appendChild(script);
}

window.handleGoogleSheetResponse = function(jsonData) {
    const rows = jsonData.table.rows;
    allLessons = [];
    
    rows.forEach(row => {
        const c = row.c;
        if (c && c.length >= 7) {
            const dayValue      = c[1] ? parseInt(c[1].v) : 0;
            const periodValue   = c[2] ? parseInt(c[2].v) : 0;
            const teacherName   = c[3] ? String(c[3].v).trim() : '';
            const className     = c[4] ? String(c[4].v).trim() : '';
            const subjectName   = c[5] ? String(c[5].v).trim() : '';
            const roomName      = c[6] ? String(c[6].v).trim() : '';
            const teacherZhName = c[7] ? String(c[7].v).trim() : '';
            const classGroup    = c[8] ? String(c[8].v).trim() : '';
            const biWeekly      = c[9] ? String(c[9].v).trim() : '';

            if (teacherName) {
                const displayName = teacherZhName ? `${teacherZhName} (${teacherName})` : teacherName;

                allLessons.push({
                    day: dayValue,
                    period: periodValue,
                    teacher: teacherName,
                    teacherDisplayName: displayName,
                    class: className.toUpperCase(),
                    subject: subjectName.toUpperCase(),
                    room: roomName.toUpperCase(),
                    classGroup: classGroup.toUpperCase(),
                    biWeekly: biWeekly
                });
            }
        }
    });

    const teacherMap = new Map();
    allLessons.forEach(l => teacherMap.set(l.teacher, l.teacherDisplayName));
    
    allTeachers = Array.from(teacherMap.entries()).sort((a,b) => a[0].localeCompare(b[0]));
    allClasses = [...new Set(allLessons.map(l => l.class).filter(c => c))].sort();

    // 🎯 選項完全重置，不設定預設選擇
    const teacherSelect = document.getElementById('myTeacherSelect');
    teacherSelect.innerHTML = '<option value="">-- 請選擇教師 --</option>';
    allTeachers.forEach(([code, name]) => {
        teacherSelect.innerHTML += `<option value="${code}">${name}</option>`;
    });

    const classSelect = document.getElementById('targetClassSelect');
    classSelect.innerHTML = '<option value="">-- 請選擇班別 --</option>';
    allClasses.forEach(c => {
        classSelect.innerHTML += `<option value="${c}">${c}</option>`;
    });

    document.getElementById('loading').style.display = 'none';
};

// 驗證節數組合是否屬於合法的四大區塊
function isValidPeriodBlock(periods) {
    if (!periods || periods.length === 0) return false;

    const validBlocks = [
        [1, 2],
        [3, 4],
        [5, 6], [6, 7], [5, 6, 7],
        [8, 9], [9, 10], [8, 9, 10]
    ];

    const sorted = [...periods].sort((a, b) => a - b);
    
    return validBlocks.some(block => {
        if (block.length !== sorted.length) return false;
        return block.every((val, index) => val === sorted[index]);
    });
}

function isTeacherFree(teacher, day, periods) {
    return periods.every(p => {
        return !allLessons.some(l => l.teacher === teacher && l.day === day && l.period === p);
    });
}

function isRoomFree(room, day, periods) {
    if (!room || room.includes('班房') || room.includes('CLASSROOM')) {
        return true; 
    }
    return periods.every(p => {
        return !allLessons.some(l => l.room === room && l.day === day && l.period === p);
    });
}

function getTeacherDailyWorkload(teacher, day) {
    const dayLessons = allLessons.filter(l => l.teacher === teacher && l.day === day);
    const uniquePeriods = new Set(dayLessons.map(l => l.period));
    return uniquePeriods.size;
}

// 檢查課堂是否有禁止調堂科目
function checkLessonRestrictions(targetClass, day, periods) {
    const periodLessons = allLessons.filter(l => l.day === day && periods.includes(l.period) && (l.class.includes(targetClass) || targetClass.includes(l.class)));
    
    // 判斷班別是否屬於高中（S4, S5, S6 或 4, 5, 6 開頭）
    const isSeniorLevel = /^(S[456]|[456])/.test(targetClass.toUpperCase());

    for (let l of periodLessons) {
        // 1. 通用禁止調堂科目檢查
        if (prohibitedSubjects.some(subj => l.subject.includes(subj))) {
            return { invalid: true, reason: `選修科目或多班分組科目不適宜作出調堂處理。` };
        }
        
        // 2. 高中 GEOG / HIST 專屬限制檢查
        if (isSeniorLevel) {
            if (seniorElectiveSubjects.some(subj => l.subject.includes(subj))) {
                return { invalid: true, reason: `高中選修科目不可調堂。` };
            }
        }
    }
    return { invalid: false };
}

// 連堂完整性檢查
function isSplittingConsecutiveLesson(targetClass, day, candidatePeriods) {
    const dayClassLessons = allLessons.filter(l => l.class === targetClass && l.day === day);

    for (let p of candidatePeriods) {
        const currentLessons = dayClassLessons.filter(l => l.period === p);
        
        for (let l of currentLessons) {
            if (p > 1 && !candidatePeriods.includes(p - 1)) {
                const prevLesson = dayClassLessons.find(prev => prev.period === p - 1 && prev.teacher === l.teacher && prev.subject === l.subject);
                if (prevLesson) return true;
            }

            if (p < 10 && !candidatePeriods.includes(p + 1)) {
                const nextLesson = dayClassLessons.find(next => next.period === p + 1 && next.teacher === l.teacher && next.subject === l.subject);
                if (nextLesson) return true;
            }
        }
    }

    return false;
}

// 核心配對邏輯
document.getElementById('searchSwapBtn').addEventListener('click', function() {
    const myTeacher = document.getElementById('myTeacherSelect').value;
    const targetClass = document.getElementById('targetClassSelect').value;
    const myDayVal = document.getElementById('myDaySelect').value;
    const myPeriods = Array.from(document.querySelectorAll('.my-p-chk:checked')).map(c => parseInt(c.value));

    // 🎯 提示未填寫完整欄位
    if (!myTeacher) { alert("請先選擇「你的姓名」！"); return; }
    if (!targetClass) { alert("請選擇「目標班別」！"); return; }
    if (!myDayVal) { alert("請選擇「原定課堂星期」！"); return; }
    if (myPeriods.length === 0) { alert("請至少勾選一個缺席節數！"); return; }

    const myDay = parseInt(myDayVal);
    const resultsDiv = document.getElementById('swapResults');

    if (!isValidPeriodBlock(myPeriods)) {
        resultsDiv.innerHTML = `<div class="warning-box">❌ <strong>不合法的調堂時段組合：</strong><br>學校規定調堂節數必須符合區塊組合（如 1-2 節、3-4 節、5-6 節、6-7 節、5-7 節、8-9 節、9-10 節、8-10 節）。不可跨區塊調堂！</div>`;
        return;
    }

    // 驗證 1：申請人課堂
    const myActualLessons = allLessons.filter(l => 
        l.teacher === myTeacher && 
        l.day === myDay && 
        myPeriods.includes(l.period)
    );

    if (myActualLessons.length === 0) {
        resultsDiv.innerHTML = `<div class="warning-box">❌ <strong>資料輸入有誤：</strong>教師 <strong>${myTeacher}</strong> 在 <strong>${dayNames[myDay]} 第 ${myPeriods.join(', ')} 節</strong> 本身為空堂，無需申請調堂！</div>`;
        return;
    }

    // 驗證 2：班別
    const hasClassMatch = myActualLessons.some(l => l.class.includes(targetClass) || targetClass.includes(l.class));
    if (!hasClassMatch) {
        const actualClasses = [...new Set(myActualLessons.map(l => l.class))].join(', ');
        resultsDiv.innerHTML = `<div class="warning-box">❌ <strong>課堂班別不符：</strong>教師 <strong>${myTeacher}</strong> 在 <strong>${dayNames[myDay]} 第 ${myPeriods.join(', ')} 節</strong> 上課班別為 [<strong>${actualClasses}</strong>]，非選擇的 [<strong>${targetClass}</strong>] 班！</div>`;
        return;
    }

    // 驗證 3：課程限制
    const myCheck = checkLessonRestrictions(targetClass, myDay, myPeriods);
    if (myCheck.invalid) {
        resultsDiv.innerHTML = `<div class="warning-box">🚫 <strong>無法調堂：</strong>您於 ${dayNames[myDay]} 第 ${myPeriods.join(', ')} 節的課堂<sup>${myCheck.reason}</sup></div>`;
        return;
    }

    resultsDiv.innerHTML = '正在進行連堂保護驗證與交叉配對...';

    // 搜尋申請人的協同教師
    const coTeacherLessons = allLessons.filter(l => 
        l.day === myDay && 
        myPeriods.includes(l.period) && 
        (l.class.includes(targetClass) || targetClass.includes(l.class)) &&
        l.teacher !== myTeacher
    );

    const coTeachersInfo = [];
    coTeacherLessons.forEach(l => {
        if (!coTeachersInfo.some(c => c.teacher === l.teacher)) {
            coTeachersInfo.push({ teacher: l.teacher, displayName: l.teacherDisplayName, room: l.room });
        }
    });

    const myLessonRoom = myActualLessons[0]?.room || '';
    const matchCandidates = [];

    // 遍歷五天尋找目標時段
    for (let d = 1; d <= 5; d++) {
        const dayClassLessons = allLessons.filter(l => l.class === targetClass && l.day === d && l.teacher !== myTeacher);
        
        const periodGroups = new Map();
        dayClassLessons.forEach(l => {
            if (!periodGroups.has(l.period)) periodGroups.set(l.period, []);
            periodGroups.get(l.period).push(l);
        });

        const sortedPeriods = Array.from(periodGroups.keys()).sort((a,b)=>a-b);

        for (let i = 0; i <= sortedPeriods.length - myPeriods.length; i++) {
            const candidatePeriods = sortedPeriods.slice(i, i + myPeriods.length);

            if (!isValidPeriodBlock(candidatePeriods)) continue;

            let isConsecutive = true;
            for (let k = 0; k < candidatePeriods.length - 1; k++) {
                if (candidatePeriods[k+1] - candidatePeriods[k] !== 1) {
                    isConsecutive = false;
                    break;
                }
            }

            if (isConsecutive && candidatePeriods.length === myPeriods.length) {
                
                if (isSplittingConsecutiveLesson(targetClass, d, candidatePeriods)) {
                    continue; 
                }

                if (checkLessonRestrictions(targetClass, d, candidatePeriods).invalid) continue;

                const targetLessons = dayClassLessons.filter(l => candidatePeriods.includes(l.period));
                const targetTeachers = [...new Set(targetLessons.map(l => l.teacher))];

                if (targetTeachers.length === 0) continue;

                const areTargetTeachersFreeAtMyDay = targetTeachers.every(t => isTeacherFree(t, myDay, myPeriods));
                const isMyTeacherFreeAtTarget = isTeacherFree(myTeacher, d, candidatePeriods);
                const areCoTeachersFreeAtTarget = coTeachersInfo.every(co => isTeacherFree(co.teacher, d, candidatePeriods));
                const isMyRoomFreeAtTarget = isRoomFree(myLessonRoom, d, candidatePeriods);
                const areCoRoomsFreeAtTarget = coTeachersInfo.every(co => isRoomFree(co.room, d, candidatePeriods));

                const targetRoomsInfo = [];
                targetTeachers.forEach(t => {
                    const lessonsForT = targetLessons.filter(l => l.teacher === t);
                    const room = lessonsForT[0]?.room || '';
                    const subjects = [...new Set(lessonsForT.map(l => l.subject))].join(' + ');
                    const displayName = lessonsForT[0]?.teacherDisplayName || t;
                    targetRoomsInfo.push({ teacher: t, displayName: displayName, room: room, subject: subjects });
                });

                const areTargetRoomsFreeAtMyDay = targetRoomsInfo.every(t => isRoomFree(t.room, myDay, myPeriods));

                if (areTargetTeachersFreeAtMyDay && isMyTeacherFreeAtTarget && areCoTeachersFreeAtTarget && isMyRoomFreeAtTarget && areCoRoomsFreeAtTarget && areTargetRoomsFreeAtMyDay) {
                    
                    const targetWorkloads = targetTeachers.map(t => {
                        return { displayName: targetLessons.find(l => l.teacher === t)?.teacherDisplayName || t, workload: getTeacherDailyWorkload(t, myDay) };
                    });

                    matchCandidates.push({
                        targetDay: d,
                        targetPeriods: candidatePeriods,
                        targetTeam: targetRoomsInfo,
                        targetWorkloads: targetWorkloads,
                        myRoom: myLessonRoom,
                        coTeachers: coTeachersInfo
                    });
                }
            }
        }
    }

    if (matchCandidates.length === 0) {
        resultsDiv.innerHTML = `<div class="info-box">⚠️ 找不到符合條件（符合獨立堂/完整連堂/非禁止科目/特別室空閒）的調堂對象。</div>`;
        return;
    }

    let html = '';

    if (coTeachersInfo.length > 0) {
        const coNames = coTeachersInfo.map(c => `<strong>${c.displayName}</strong> (${c.room || '無特別室'})`).join('、');
        const coListOnlyNames = coTeachersInfo.map(c => c.displayName).join('、');
        
        html += `
            <div class="co-teacher-alert">
                📢 <strong>涉及協同/分組教師提醒：</strong><br>
                此課堂同時有協同/分組教師：${coNames}。<br>
                ⚠️ 系統已確認該協同教師及房間在調堂目標時段皆為空閒！<strong>請務必於提交調堂申請前，先與 ${coListOnlyNames} 討論並確認調堂事宜。</strong>
            </div>
        `;
    }

    html += `
        <h3>🎯 為您找到 ${matchCandidates.length} 個可對換「合法對換方案」：</h3>
        <table class="results-table">
            <thead>
                <tr>
                    <th>對換教師</th>
                    <th>對方在 ${targetClass} 的時段與科目</th>
                    <th>對換團隊在 ${dayNames[myDay]} 原本課堂數</th>
                    <th>申請人協同狀態</th>
                    <th>對換團隊特別室空閒狀態</th>
                    <th>調堂建議方案與地點</th>
                </tr>
            </thead>
            <tbody>
    `;

    matchCandidates.forEach(cand => {
        const myRoomText = cand.myRoom ? ` (於 ${cand.myRoom})` : '';
        
        const teamNames = cand.targetTeam.map(t => `<strong>${t.displayName}</strong>`).join(' + ');
        const teamSubjectDesc = cand.targetTeam.map(t => `<span class="badge-subject">${t.displayName}: ${t.subject}</span>`).join('<br>');
        const teamRoomsDesc = cand.targetTeam.map(t => `${t.displayName} 於 ${t.room || '班房'}`).join('、');

        const workloadsDesc = cand.targetWorkloads.map(w => {
            const bClass = w.workload >= 5 ? 'badge-heavy' : 'badge-workload';
            return `<span class="${bClass}">${w.displayName}: 原有 ${w.workload} 節</span>`;
        }).join('<br>');

        let coTeacherStatus = '<span style="color:#94a3b8;">無協同教師</span>';
        if (cand.coTeachers && cand.coTeachers.length > 0) {
            coTeacherStatus = cand.coTeachers.map(c => `<span class="badge-ok">✅ ${c.displayName} 可調堂</span>`).join('<br>');
        }

        const targetRoomsStatus = cand.targetTeam.map(t => {
            return t.room ? `<span class="badge-room">✅ ${t.room} 空閒</span>` : '<span style="color:#94a3b8;">普通班房</span>';
        }).join('<br>');

        const isMultiTeacher = cand.targetTeam.length > 1;
        const groupBadge = isMultiTeacher ? `<br><span class="badge-group">👥 跨科/分組組合 (${cand.targetTeam.length}位老師)</span>` : '';

        html += `
            <tr>
                <td>${teamNames} ${groupBadge}</td>
                <td>
                    <span class="highlight">${dayNames[cand.targetDay]} 第 ${cand.targetPeriods.join(', ')} 節</span><br>
                    <small>${teamSubjectDesc}</small>
                </td>
                <td>${workloadsDesc}</td>
                <td>${coTeacherStatus}</td>
                <td>${targetRoomsStatus}</td>
                <td style="color: #d35400; font-weight: bold;">
                    您與協同教師於 ${dayNames[cand.targetDay]} 第 ${cand.targetPeriods.join(', ')} 節 替 ${cand.targetTeam.map(t=>t.displayName).join('及')} 上課${myRoomText}；<br>
                    ${cand.targetTeam.map(t=>t.displayName).join('及')} 於 ${dayNames[myDay]} 第 ${myPeriods.join(', ')} 節 替您上課（分別${teamRoomsDesc}）。
                </td>
            </tr>
        `;
    });

    html += `</tbody></table>`;
    resultsDiv.innerHTML = html;
});

loadGoogleSheetData();
</script>
